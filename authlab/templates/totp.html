{% extends "base.html" %}
{% block title %}{{ t('totp.title') }}{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-copy">
    <p class="eyebrow">{{ t('totp.eyebrow') }}</p>
    <h1>{{ t('totp.h1') }}</h1>
    <p>{{ t('totp.lede', username=username|e)|safe }}</p>
  </div>
  <form class="card form" method="post" action="{{ url_for('auth.login_totp') }}">
    {% if error %}<div class="flash error">{{ error|tr }}</div>{% endif %}
    <label for="totp-code">{{ t('totp.code_label') }}</label>
    <input id="totp-code" name="code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]{6}" maxlength="6" autofocus required>
    <button id="totp-submit" class="btn primary" type="submit">{{ t('totp.submit') }}</button>
    <p class="small muted">{{ t('totp.note') }}</p>
  </form>
</section>
{% endblock %}
