{% extends "base.html" %}
{% block title %}{{ t('reset.title') }}{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-copy">
    <p class="eyebrow">{{ t('reset.eyebrow') }}</p>
    <h1>{{ t('reset.h1') }}</h1>
    <p>{{ t('reset.lede', username=username|e)|safe }}</p>
  </div>
  <form class="card form" method="post" action="{{ url_for('recovery.reset', token=token) }}">
    {% if error %}<div class="flash error">{{ error|tr }}</div>{% endif %}
    <label for="reset-password">{{ t('reset.new_password') }}</label>
    <input id="reset-password" name="password" type="password" autocomplete="new-password" required>
    <label for="reset-confirm">{{ t('reset.confirm') }}</label>
    <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" required>
    <button id="reset-submit" class="btn primary" type="submit">{{ t('reset.submit') }}</button>
  </form>
</section>
{% endblock %}
