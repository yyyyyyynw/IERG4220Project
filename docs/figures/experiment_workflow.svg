<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" fill="#0F172A">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      text { font-family: "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
      .muted { fill: #5B6785; }
      .faint { fill: #7C89A6; }
      .card { fill: #FFFFFF; stroke: #DDE3EE; stroke-width: 1.5; }
      .inner { fill: #F8FAFC; stroke: #DDE3EE; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1680" height="1240" fill="#F6F7FB"/>

  <text x="60" y="56" font-size="30" font-weight="700">AuthLab 實驗工作流：從情境程式到結果圖表</text>
  <text x="60" y="88" font-size="14" class="mono muted">experiments/run_experiments.py → experiments/results/results.json → experiments/analyze.py → figures/</text>

  <!-- ============ STAGE 1 ============ -->
  <rect x="60" y="118" width="1004" height="212" rx="16" class="card"/>
  <circle cx="88" cy="148" r="14" fill="#2563EB"/>
  <text x="88" y="153" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="112" y="155" font-size="18" font-weight="700">啟動隔離環境</text>
  <text x="1042" y="153" font-size="12" class="mono faint" text-anchor="end">experiments/harness.py</text>

  <rect x="80" y="176" width="300" height="128" rx="12" class="inner"/>
  <text x="96" y="202" font-size="15" font-weight="700">AuthLab 真站</text>
  <text x="96" y="226" font-size="12.5" class="mono" fill="#2563EB">app.lvh.me:5010</text>
  <text x="96" y="248" font-size="12.5" class="muted">暫存 SQLite · LAB_MODE</text>
  <text x="96" y="270" font-size="12.5" class="muted">RP_ID / ORIGINS 固定</text>

  <rect x="396" y="176" width="316" height="128" rx="12" class="inner"/>
  <text x="412" y="202" font-size="15" font-weight="700">釣魚反向代理</text>
  <text x="412" y="226" font-size="12.5" class="mono" fill="#D97706">evil.app.lvh.me:5011</text>
  <text x="412" y="248" font-size="12.5" class="muted">擷取帳密、轉送 WebAuthn</text>
  <text x="412" y="270" font-size="12.5" class="muted">只在 loopback 使用</text>

  <rect x="728" y="176" width="316" height="128" rx="12" class="inner"/>
  <text x="744" y="202" font-size="15" font-weight="700">Headless Chrome</text>
  <text x="744" y="226" font-size="12.5" class="mono" fill="#7C3AED">CDP 虛擬 authenticator</text>
  <text x="744" y="248" font-size="12.5" class="muted">internal → 平台 / synced passkey</text>
  <text x="744" y="270" font-size="12.5" class="muted">usb → 實體硬體金鑰模型</text>

  <text x="80" y="322" font-size="12.5" class="muted">lvh.me 解析到 127.0.0.1，但瀏覽器視為兩個不同 origin——這是釣魚情境能成立的原因。</text>

  <line x1="562" y1="330" x2="562" y2="360" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 2 ============ -->
  <rect x="60" y="368" width="1004" height="336" rx="16" class="card"/>
  <circle cx="88" cy="398" r="14" fill="#2563EB"/>
  <text x="88" y="403" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="112" y="405" font-size="18" font-weight="700">逐情境、逐 trial 執行</text>
  <text x="1042" y="403" font-size="12" class="mono faint" text-anchor="end">25 scenarios × N（多數 5 · 小樣本 3 · 延遲 10）</text>

  <rect x="74" y="416" width="976" height="78" rx="12" fill="none" stroke="#C7D2E5" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- chips -->
  <g>
    <rect x="86" y="428" width="110" height="54" rx="10" fill="#EFF5FF" stroke="#BFD4FB"/>
    <text x="141" y="450" font-size="13.5" font-weight="700" text-anchor="middle">新使用者</text>
    <text x="141" y="468" font-size="10.5" class="mono faint" text-anchor="middle">fresh context</text>

    <rect x="206" y="428" width="110" height="54" rx="10" fill="#EFF5FF" stroke="#BFD4FB"/>
    <text x="261" y="450" font-size="13.5" font-weight="700" text-anchor="middle">註冊帳密</text>
    <text x="261" y="468" font-size="10.5" class="mono faint" text-anchor="middle">register</text>

    <rect x="326" y="428" width="110" height="54" rx="10" fill="#F5F0FF" stroke="#D8C8FB"/>
    <text x="381" y="450" font-size="13.5" font-weight="700" text-anchor="middle">註冊憑證</text>
    <text x="381" y="468" font-size="10.5" class="mono faint" text-anchor="middle">passkey / key</text>

    <rect x="446" y="428" width="110" height="54" rx="10" fill="#EFF5FF" stroke="#BFD4FB"/>
    <text x="501" y="450" font-size="13.5" font-weight="700" text-anchor="middle">登出</text>
    <text x="501" y="468" font-size="10.5" class="mono faint" text-anchor="middle">logout</text>

    <rect x="566" y="428" width="110" height="54" rx="10" fill="#FFF7EA" stroke="#F3D6A4"/>
    <text x="621" y="450" font-size="13.5" font-weight="700" text-anchor="middle">攻擊 / 任務</text>
    <text x="621" y="468" font-size="10.5" class="mono faint" text-anchor="middle">scenario step</text>

    <rect x="686" y="428" width="110" height="54" rx="10" fill="#ECFDF5" stroke="#B7E4CE"/>
    <text x="741" y="450" font-size="13.5" font-weight="700" text-anchor="middle">記錄結果</text>
    <text x="741" y="468" font-size="10.5" class="mono faint" text-anchor="middle">success + ms</text>

    <rect x="806" y="428" width="110" height="54" rx="10" fill="#ECFDF5" stroke="#B7E4CE"/>
    <text x="861" y="450" font-size="13.5" font-weight="700" text-anchor="middle">寫入 details</text>
    <text x="861" y="468" font-size="10.5" class="mono faint" text-anchor="middle">raw trial</text>

    <rect x="926" y="428" width="110" height="54" rx="10" fill="#F1F5F9" stroke="#D5DEEA"/>
    <text x="981" y="450" font-size="13.5" font-weight="700" text-anchor="middle">清理</text>
    <text x="981" y="468" font-size="10.5" class="mono faint" text-anchor="middle">close client</text>
  </g>

  <rect x="80" y="508" width="964" height="94" rx="12" class="inner"/>
  <text x="96" y="532" font-size="13" font-weight="700">單筆 trial 記錄</text>
  <text x="96" y="557" font-size="12.5" class="mono" fill="#1D4ED8">{"success": true, "elapsed_ms": 1234.5, "error": null, "stage": "…"}</text>
  <text x="96" y="582" font-size="12.5" class="muted">每個 trial 都建立新使用者與新瀏覽器 context；單次失敗會記錄 error，不會中斷整批。</text>

  <text x="80" y="636" font-size="12.5" class="muted">success 的語意由情境定義：P1 是「攻擊者登入成功」，S1 是「使用者完成任務」。</text>
  <text x="80" y="668" font-size="12.5" class="muted">失敗的 trial 也會保留：error 與失敗率本身就是結果的一部分，不會被隱藏或重試掩蓋。</text>

  <line x1="562" y1="704" x2="562" y2="734" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 3 ============ -->
  <rect x="60" y="742" width="1004" height="178" rx="16" class="card"/>
  <circle cx="88" cy="772" r="14" fill="#2563EB"/>
  <text x="88" y="777" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="112" y="779" font-size="18" font-weight="700">彙總成原始資料</text>
  <text x="1042" y="777" font-size="12" class="mono faint" text-anchor="end">summarize()</text>

  <rect x="80" y="794" width="440" height="104" rx="12" class="inner"/>
  <text x="96" y="819" font-size="14" font-weight="700" class="mono">summarize(scenario)</text>
  <text x="96" y="843" font-size="12.5" class="muted">trials · successes · rate</text>
  <text x="96" y="864" font-size="12.5" class="muted">mean_ms / median_ms（只計成功）</text>
  <text x="96" y="885" font-size="12.5" class="muted">details[] 保留每一筆原始紀錄</text>

  <line x1="524" y1="846" x2="536" y2="846" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="794" width="504" height="104" rx="12" fill="#0F172A" stroke="#0F172A"/>
  <text x="556" y="819" font-size="14" font-weight="700" fill="#93C5FD" class="mono">results.json</text>
  <text x="556" y="843" font-size="12.5" fill="#E2E8F0">每完成一個情境就立刻覆寫（中斷也保留）</text>
  <text x="556" y="864" font-size="12.5" fill="#E2E8F0" class="mono">meta · scenarios[25] · latency</text>
  <text x="556" y="885" font-size="12.5" fill="#E2E8F0" class="mono">error_paths · protocol_checks</text>

  <line x1="562" y1="920" x2="562" y2="950" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 4 ============ -->
  <rect x="60" y="958" width="1004" height="202" rx="16" class="card"/>
  <circle cx="88" cy="988" r="14" fill="#2563EB"/>
  <text x="88" y="993" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="112" y="995" font-size="18" font-weight="700">分析、出表、出圖</text>
  <text x="1042" y="993" font-size="12" class="mono faint" text-anchor="end">python experiments/analyze.py</text>

  <rect x="80" y="1012" width="440" height="126" rx="12" fill="#F5F0FF" stroke="#D8C8FB"/>
  <text x="96" y="1037" font-size="14" font-weight="700" class="mono" fill="#6D28D9">analyze.py</text>
  <text x="96" y="1061" font-size="12.5" class="muted">① 方向對照：attack / defense / task</text>
  <text x="96" y="1082" font-size="12.5" class="muted">② 防禦型情境取 trials − successes</text>
  <text x="96" y="1103" font-size="12.5" class="muted">③ Wilson 95% 信賴區間</text>
  <text x="96" y="1124" font-size="12.5" class="muted">④ R2 特例：5 個 offset 各 5 次</text>

  <line x1="524" y1="1075" x2="536" y2="1075" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="1012" width="504" height="126" rx="12" fill="#ECFDF5" stroke="#B7E4CE"/>
  <text x="556" y="1037" font-size="14" font-weight="700" fill="#047857">輸出</text>
  <text x="556" y="1061" font-size="12.5" class="muted">CSV / JSON：scenarios · latency · analysis</text>
  <text x="556" y="1082" font-size="12.5" class="muted">Markdown：summary · latency · klm</text>
  <text x="556" y="1103" font-size="12.5" class="muted">figures/：phishing · replay_recovery</text>
  <text x="556" y="1124" font-size="12.5" class="muted">latency · totp_window · klm（共 5 張）</text>

  <!-- ============ RIGHT PANEL ============ -->
  <rect x="1100" y="118" width="524" height="1042" rx="18" class="card"/>
  <text x="1124" y="154" font-size="18" font-weight="700">25 個情境在做什麼</text>
  <text x="1124" y="176" font-size="12.5" class="muted">P 釣魚 · R 重放 · S 復原 · U 可用性</text>

  <!-- P -->
  <rect x="1120" y="190" width="484" height="228" rx="12" fill="#FFF7EA" stroke="#F3D6A4"/>
  <text x="1136" y="216" font-size="14" font-weight="700" fill="#92400E">P — 釣魚與 relay（10）</text>
  <g font-size="12.5">
    <circle cx="1142" cy="238" r="4" fill="#DC2626"/>
    <text x="1154" y="242" class="muted">P1　密碼 + TOTP 即時轉送 → 5/5 成功</text>
    <circle cx="1142" cy="262" r="4" fill="#059669"/>
    <text x="1154" y="266" class="muted">P1b　重放釣到的 TOTP → 被計數器擋下</text>
    <circle cx="1142" cy="286" r="4" fill="#059669"/>
    <text x="1154" y="290" class="muted">P1c　過期 TOTP（−2 步）→ 被時間窗擋下</text>
    <circle cx="1142" cy="310" r="4" fill="#D97706"/>
    <text x="1154" y="314" class="muted">P1d　關閉 replay 保護 → 同一碼可用兩次</text>
    <circle cx="1142" cy="334" r="4" fill="#059669"/>
    <text x="1154" y="338" class="muted">P2/P5　假 RP ID → 無憑證，註冊失敗</text>
    <circle cx="1142" cy="358" r="4" fill="#059669"/>
    <text x="1154" y="362" class="muted">P3/P6　嚴格 origin relay → 攻擊 0/5</text>
    <circle cx="1142" cy="382" r="4" fill="#DC2626"/>
    <text x="1154" y="386" class="muted">P4/P7　寬鬆 origin relay → 攻擊 5/5</text>
  </g>

  <!-- R -->
  <rect x="1120" y="430" width="484" height="190" rx="12" fill="#EFF5FF" stroke="#BFD4FB"/>
  <text x="1136" y="456" font-size="14" font-weight="700" fill="#1E40AF">R — 重放與計數器（7）</text>
  <g font-size="12.5">
    <circle cx="1142" cy="478" r="4" fill="#059669"/>
    <text x="1154" y="482" class="muted">R1　TOTP：naive 可重用、hardened 阻擋</text>
    <circle cx="1142" cy="502" r="4" fill="#2563EB"/>
    <text x="1154" y="506" class="muted">R2　時間窗：只接受 −1 / 0 / +1</text>
    <circle cx="1142" cy="526" r="4" fill="#059669"/>
    <text x="1154" y="530" class="muted">R3/R4　重放捕獲的 assertion → 被拒</text>
    <circle cx="1142" cy="550" r="4" fill="#059669"/>
    <text x="1154" y="554" class="muted">R5　counter 倒退 → 被拒</text>
    <circle cx="1142" cy="574" r="4" fill="#D97706"/>
    <text x="1154" y="578" class="muted">R6　counter 超前（偽造）→ 被接受</text>
    <circle cx="1142" cy="598" r="4" fill="#2563EB"/>
    <text x="1154" y="602" class="muted">R7　synced passkey 的寬鬆 counter 政策</text>
  </g>

  <!-- S -->
  <rect x="1120" y="632" width="484" height="214" rx="12" fill="#ECFDF5" stroke="#B7E4CE"/>
  <text x="1136" y="658" font-size="14" font-weight="700" fill="#047857">S — 復原與存活（8）</text>
  <g font-size="12.5">
    <circle cx="1142" cy="680" r="4" fill="#059669"/>
    <text x="1154" y="684" class="muted">S1　同步 passkey 還原 → 可登入</text>
    <circle cx="1142" cy="704" r="4" fill="#DC2626"/>
    <text x="1154" y="708" class="muted">S2/S3　平台 / 硬體憑證遺失 → 無法登入</text>
    <circle cx="1142" cy="728" r="4" fill="#059669"/>
    <text x="1154" y="732" class="muted">S4　備用硬體金鑰 → 可登入</text>
    <circle cx="1142" cy="752" r="4" fill="#059669"/>
    <text x="1154" y="756" class="muted">S5　復原碼登入 → 可登入</text>
    <circle cx="1142" cy="776" r="4" fill="#059669"/>
    <text x="1154" y="780" class="muted">S6　復原碼重複使用 → 第二次被拒</text>
    <circle cx="1142" cy="800" r="4" fill="#059669"/>
    <text x="1154" y="804" class="muted">S7　Email 重設流程不變量 → 通過</text>
    <circle cx="1142" cy="824" r="4" fill="#059669"/>
    <text x="1154" y="828" class="muted">S8　過期重設 token → 被拒</text>
  </g>

  <!-- U -->
  <rect x="1120" y="858" width="484" height="150" rx="12" fill="#F1F5F9" stroke="#D5DEEA"/>
  <text x="1136" y="884" font-size="14" font-weight="700" fill="#334155">U — 可用性與協定（不計入 25）</text>
  <g font-size="12.5">
    <circle cx="1142" cy="906" r="4" fill="#7C3AED"/>
    <text x="1154" y="910" class="muted">U1　9 種操作的實際延遲（每種 10 次）</text>
    <circle cx="1142" cy="930" r="4" fill="#7C3AED"/>
    <text x="1154" y="934" class="muted">U2　錯誤路徑是否 fail closed（各 3 次）</text>
    <circle cx="1142" cy="954" r="4" fill="#7C3AED"/>
    <text x="1154" y="958" class="muted">Protocol　cookie、challenge 熵、token 雜湊</text>
  </g>

  <!-- conclusion -->
  <rect x="1120" y="1020" width="484" height="120" rx="12" fill="#0F172A"/>
  <text x="1138" y="1048" font-size="13.5" font-weight="700" fill="#6EE7B7">核心結論</text>
  <text x="1138" y="1074" font-size="12.5" fill="#E2E8F0">同一個 passkey assertion：</text>
  <text x="1138" y="1096" font-size="12.5" fill="#E2E8F0">嚴格 origin → 0/5；寬鬆 origin → 5/5。</text>
  <text x="1138" y="1118" font-size="12.5" fill="#E2E8F0">驗證器設定決定成敗，復原流程最弱。</text>

  <!-- footer -->
  <text x="60" y="1200" font-size="12.5" class="muted">資料來源：experiments/results/results.json（2026-11-09）· 全套約 6–10 分鐘 · 虛擬 authenticator，非人類受試資料</text>
  <text x="1620" y="1200" font-size="12.5" fill="#B45309" text-anchor="end">重跑會覆寫 checked-in 結果與 figures/</text>
</svg>
